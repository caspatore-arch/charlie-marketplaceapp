<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're on the list — Dibbs</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#EE3B30" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* Palette mirrors waitlist/index.html, which mirrors constants/theme.ts. */
    :root {
      --bg: #FCF8F7;
      --surface: #FFFFFF;
      --ink: #161513;
      --ink-muted: #6F6A62;
      --line: #E8E1DE;
      --brand: #EE3B30;
      --accent: #DE2F26;
      --accent-pressed: #C4281F;
      --font: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      /* dvh tracks Safari's collapsing toolbar; vh above is the fallback. */
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 40px 32px 32px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(22,21,19,.04), 0 8px 24px -8px rgba(22,21,19,.12);
    }
    /* The mark sits on its own red disc so the white wordmark has the ground
       it was drawn for, instead of floating on white. */
    .mark {
      width: 96px; height: 96px;
      margin: 0 auto 24px;
      border-radius: 28px;
      background: var(--brand);
      display: grid;
      place-items: center;
      padding: 0 16px;
    }
    .mark img { width: 100%; height: auto; display: block; }
    h1 { margin: 0 0 10px; font-size: 27px; font-weight: 800; letter-spacing: -.022em; }
    p { margin: 0 0 26px; color: var(--ink-muted); font-size: 15px; }
    a.back {
      display: inline-block;
      min-height: 48px;
      padding: 13px 24px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color .15s ease;
    }
    a.back:hover { background: var(--accent-pressed); }
    a.back:focus-visible { outline: 3px solid #FDEAE8; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <img src="/dibbs-wordmark-white.png" width="900" height="376" alt="Dibbs" />
    </div>
    <h1>You're on the list.</h1>
    <p>We'll email you when Dibbs opens for UArizona students. Nothing else.</p>
    <a class="back" href="/">Back to the site</a>
  </div>
</body>
</html>
